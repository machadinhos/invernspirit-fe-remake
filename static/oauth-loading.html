<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Loading OAuth Page</title>
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0;
        background: #323230;
        height: 100vh;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      .spinner {
        animation: spin 1s linear infinite;
        margin: 20px;
        border: 6px solid #444;
        border-top-color: #ff883e;
        border-radius: 50%;
        width: 50px;
        height: 50px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(1turn);
        }
      }

      .loading-text {
        color: #fff;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div class="spinner" role="status" aria-live="polite" aria-label="Loading…"></div>
    <div class="loading-text" id="loadingText" aria-live="polite">Loading.</div>

    <script>
      // if (!window.opener) {
      //   document.body.innerHTML = `<p>You should not be here.</p>`;
      //   throw new Error('You should not be here');
      // }

      const loadingText = document.getElementById('loadingText');
      const dots = ['.', '..', '...'];
      let i = 0;

      setInterval(() => {
        loadingText.textContent = 'Loading' + dots[i];
        i = (i + 1) % dots.length;
      }, 500);
    </script>
  </body>
</html>
